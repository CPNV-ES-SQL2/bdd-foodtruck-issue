services:
  mysql-1:
    image: mysql:lts
    container_name: mysql-1
    ports:
      - 3306:3306
    environment:
      MYSQL_USER: cpnv
      MYSQL_PASSWORD: BigPassword
      MYSQL_ROOT_PASSWORD: BigPassword
    volumes:
      - mysql-1-data:/var/lib/mysql

  mysql-2:
    image: mysql:lts
    container_name: mysql-2
    ports:
      - 3307:3306
    environment:
      MYSQL_USER: cpnv
      MYSQL_PASSWORD: BigPassword
      MYSQL_ROOT_PASSWORD: BigPassword
    volumes:
      - ./config:/etc/mysql/conf.d
      - mysql-2-data:/var/lib/mysql

volumes:
  mysql-1-data:
  mysql-2-data: